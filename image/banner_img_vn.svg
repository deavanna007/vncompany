<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <radialGradient id="orange-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blue-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b0"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <linearGradient id="gold-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <radialGradient id="center-gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff8c00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>

    <pattern id="dot-matrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#00f0ff" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-glow)"/>

  <rect width="1600" height="900" fill="url(#tech-grid)"/>
  
  <circle cx="200" cy="450" r="400" fill="url(#blue-glow)"/>
  <circle cx="1400" cy="450" r="400" fill="url(#orange-glow)"/>
  <circle cx="800" cy="380" r="350" fill="url(#center-gold-glow)"/>

  <g stroke-linecap="round" stroke-width="2" opacity="0.4">
    <path d="M-100 200 L 300 200 L 400 300 L 200 500" fill="none" stroke="#00f0ff" filter="url(#glow-soft)"/>
    <circle cx="300" cy="200" r="4" fill="#00f0ff"/>
    <circle cx="400" cy="300" r="4" fill="#00f0ff"/>
    
    <path d="M1700 700 L 1300 700 L 1200 600 L 1350 450" fill="none" stroke="#ff6b00" filter="url(#glow-soft)"/>
    <circle cx="1300" cy="700" r="4" fill="#ff6b00"/>
    <circle cx="1200" cy="600" r="4" fill="#ff6b00"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" fill="none">
    <rect x="30" y="30" width="1540" height="840" rx="10"/>
    <path d="M 50 30 L 120 30 L 150 60 L 50 60 Z" fill="#00f0ff" fill-opacity="0.1" stroke="none"/>
    <path d="M 1550 870 L 1480 870 L 1450 840 L 1550 840 Z" fill="#ff6b00" fill-opacity="0.2" stroke="none"/>
  </g>

  <rect x="60" y="80" width="180" height="180" fill="url(#dot-matrix)"/>
  <rect x="1360" y="640" width="180" height="180" fill="url(#dot-matrix)"/>

  <g transform="translate(320, 260) rotate(-25) scale(0.45)" filter="url(#glow-soft)" opacity="0.7">
    <rect x="-100" y="-100" width="200" height="200" rx="40" fill="#ffd700" opacity="0.3" filter="url(#glow-heavy)"/>
    <rect x="-100" y="-100" width="200" height="200" rx="45" fill="url(#gold-metal)" stroke="url(#gold-light)" stroke-width="6"/>
    <rect x="-45" y="-45" width="90" height="90" rx="15" fill="#0f172a" stroke="url(#gold-metal)" stroke-width="12"/>
  </g>

  <g transform="translate(1250, 280) rotate(20) scale(0.6)" filter="url(#glow-soft)" opacity="0.8">
    <rect x="-100" y="-100" width="200" height="200" rx="40" fill="#ff8c00" opacity="0.3" filter="url(#glow-heavy)"/>
    <rect x="-100" y="-100" width="200" height="200" rx="45" fill="url(#gold-metal)" stroke="url(#gold-light)" stroke-width="6"/>
    <rect x="-45" y="-45" width="90" height="90" rx="15" fill="#0f172a" stroke="url(#gold-metal)" stroke-width="12"/>
  </g>

  <g transform="translate(180, 680) rotate(35) scale(0.8)" filter="url(#glow-heavy)" opacity="0.5">
    <rect x="-100" y="-100" width="200" height="200" rx="45" fill="url(#gold-metal)"/>
  </g>

  <g transform="translate(800, 310) rotate(-10) scale(1.15)">
    <rect x="-110" y="-110" width="220" height="220" rx="55" fill="#ffd700" opacity="0.4" filter="url(#glow-heavy)"/>
    
    <rect x="-95" y="-90" width="200" height="200" rx="48" fill="#784f07"/>
    <rect x="-98" y="-94" width="200" height="200" rx="48" fill="#a16b0a"/>
    
    <rect x="-100" y="-100" width="200" height="200" rx="48" fill="url(#gold-metal)" stroke="url(#gold-light)" stroke-width="4"/>
    
    <rect x="-80" y="-80" width="160" height="160" rx="36" fill="none" stroke="#5c3a00" stroke-width="3" opacity="0.6"/>
    <rect x="-76" y="-76" width="152" height="152" rx="32" fill="none" stroke="#fff5c0" stroke-width="2" opacity="0.8"/>

    <rect x="-42" y="-42" width="84" height="84" rx="18" fill="#0b0f19" stroke="url(#gold-metal)" stroke-width="14"/>
    <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#050811"/>
  </g>

  <g fill="#ffffff" filter="url(#glow-soft)">
    <circle cx="700" cy="200" r="3" opacity="0.8"/>
    <circle cx="920" cy="220" r="4" opacity="0.9"/>
    <circle cx="650" cy="420" r="2" opacity="0.6"/>
    <circle cx="950" cy="400" r="5" opacity="0.7" fill="#ffd700"/>
    <circle cx="820" cy="160" r="6" opacity="0.8" fill="#ffffff"/>
    <path d="M 820 145 L 820 175 M 805 160 L 835 160" stroke="#ffffff" stroke-width="2"/>
    <path d="M 920 210 L 920 230 M 910 220 L 930 220" stroke="#ffd700" stroke-width="2"/>
  </g>

  <g transform="translate(800, 580)">
    <text x="0" y="6" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="88" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#000000" opacity="0.8">
      VN COMPANY
    </text>
    
    <text x="0" y="0" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="88" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#ffffff" filter="url(#glow-heavy)" opacity="0.3">
      VN COMPANY
    </text>

    <text x="0" y="0" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="88" font-weight="900" letter-spacing="12" text-anchor="middle" fill="#ffffff">
      VN<tspan fill="#ff6b00"> </tspan><tspan fill="#ff9d00">COMPANY</tspan>
    </text>
  </g>

  <g transform="translate(800, 650)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#0f172a" fill-opacity="0.7" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-soft)"/>
    
    <text x="0" y="6" font-family="'Rajdhani', 'Roboto', sans-serif" font-size="22" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#00f0ff">
      OFFICIAL ROBUX STORE
    </text>
  </g>

  <g transform="translate(800, 730)" font-family="'Rajdhani', 'Roboto', sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#94a3b8" text-anchor="middle">
    <text x="0" y="0">
      <tspan fill="#00f0ff">INSTANT DELIVERY</tspan>  •  <tspan fill="#ffd700">LOWEST PRICE</tspan>  •  <tspan fill="#ff6b00">100% SAFE</tspan>
    </text>
  </g>

  <g transform="translate(800, 780)">
    <line x1="-300" y1="0" x2="300" y2="0" stroke="url(#orange-glow)" stroke-width="3" filter="url(#glow-soft)"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#ff6b00" stroke-width="2"/>
    <polygon points="0,-6 -6,0 0,6 6,0" fill="#00f0ff" filter="url(#glow-soft)"/>
  </g>

  <path d="M 60 820 L 60 840 L 140 840" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.7"/>
  <path d="M 1540 80 L 1540 60 L 1460 60" fill="none" stroke="#ff6b00" stroke-width="3" opacity="0.7"/>
</svg>
